packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency build scripts by default. These are allow-listed
# explicitly rather than the block being disabled wholesale: a postinstall script
# runs arbitrary code at install time, so the set permitted to do so should be
# short and deliberate.
#
#   prisma / @prisma/engines  — fetch and place the query engine binary
#   esbuild                   — platform binary used by vite and vitest
onlyBuiltDependencies:
  - prisma
  - '@prisma/engines'
  - esbuild

# Merged from the create-next-app scaffold, which wrote its own nested
# workspace file. Nested workspace roots break pnpm resolution.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
